
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'my_new_project'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'default'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In dbt, the default materialization for a model is a view. This means, when you run 
# dbt run or dbt build, all of your models will be built as a view in your data platform. 
# The configuration below will override this setting for models in the example folder to 
# instead be materialized as tables. Any models you add to the root of the models folder will 
# continue to be built as views. These settings can be overridden in the individual model files
# using the `{{ config(...) }}` macro.

seeds:
  dbt_practice:
    +schema: raw
    +quote_columns: false
    raw_customers:
      +column_types:
        customer_id: varchar
        membership_type: varchar
        signup_channel: varchar
          
    raw_rides:
      +column_types:
        ride_id: varchar
        ride_type: varchar
        thrill_level: varchar
        zone: varchar
        status: varchar
    raw_tickets:
      +column_types:
        ticket_id: varchar
        customer_id: varchar
        ticket_type: varchar
        purchase_channel: varchar
        promo_code: varchar
    raw_feedback:
      +column_types:
        feedback_id: varchar
        customer_id: varchar
        ride_id: varchar
        category: varchar
        sentiment: varchar
    raw_sales_transactions:
      +column_types:
        transaction_id: varchar
        customer_id: varchar
        category: varchar
        item_name: varchar
        payment_method: varchar
        location: varchar
    raw_employees:
      +column_types:
        employee_id: varchar
        manager_id: varchar
        department: varchar
        role: varchar
        zone_assignment: varchar
    raw_haunted_events:
      +column_types:
        event_id: varchar
        event_name: varchar
        event_type: varchar
        external_partner: varchar
        description: varchar
    macro_demos:
      +schema: macro_demos_sample
      +quote_columns: false
      demo_21_sample_merge:
        +column_types:
          sale_id: varchar
          customer_id: varchar
          ticket_id: varchar
          purchase_date: date
          visit_date: date
          ticket_price: number(10,2)
          discount_percent: number(5,2)
          discount_category: varchar
          visit_hour: integer
          payment_method: varchar
          purchase_channel: varchar
          is_online: boolean
          same_day_visit: boolean
          advance_purchase: boolean
          visit_time_category: varchar
          business_season: varchar
          created_at: timestamp_ntz
          updated_at: timestamp_ntz
      demo_22_sample_append:
        +column_types:
          sales_key: varchar
          transaction_id: varchar
          customer_id: varchar
          visit_date: date
          day_of_week: varchar
          month_name: varchar
          quarter: integer
          year: integer
          is_weekend: boolean
          category: varchar
          item_name: varchar
          quantity: integer
          unit_price: number(10,2)
          total_amount: number(10,2)
          payment_method: varchar
          location: varchar
          _loaded_at: timestamp_ntz
      demo_23_sample_delete_insert:
        +column_types:
          visit_date: date
          ticket_type: varchar
          unique_visitors: integer
          total_visits: integer
          total_ticket_revenue: number(12,2)
          total_in_park_spend: number(12,2)
          total_visit_spend: number(12,2)
          avg_satisfaction_rating: number(4,2)
          min_ticket_price: number(10,2)
          max_ticket_price: number(10,2)
      demo_24_sample_insert_overwrite:
        +column_types:
          revenue_month: date
          category: varchar
          location: varchar
          payment_method: varchar
          total_revenue: number(14,2)
          total_units_sold: integer
          total_transactions: integer
          unique_customers: integer
          avg_transaction_value: number(10,2)
          max_transaction_value: number(10,2)
      demo_25_sample_microbatch:
        +column_types:
          sale_id: varchar
          customer_id: varchar
          ticket_id: varchar
          purchase_date: date
          purchase_ts: timestamp_ntz
          visit_date: date
          ticket_price: number(10,2)
          discount_percent: number(5,2)
          discount_category: varchar
          payment_method: varchar
          purchase_channel: varchar
          is_online: boolean
          same_day_visit: boolean
          advance_purchase: boolean
          visit_time_category: varchar
          business_season: varchar
          updated_at: timestamp_ntz


models:
  my_new_project:
    # Applies to all files under models/example/
    example:
      +materialized: table
